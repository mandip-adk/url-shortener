{% extends "base.html" %}
{% block title %}Delete Short URL{% endblock %}

{% block content %}
  <h2>Delete Short URL</h2>
  <p>Are you sure you want to delete <strong>{{ object.short_code }}</strong> → {{ object.original_url }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
